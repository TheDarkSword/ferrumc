# Standalone (its own `[workspace]`) dev-only load-testing tool. It is intentionally NOT a member
# of the main FerrumC workspace: it pulls the large `azalea` dependency tree, which should never be
# compiled as part of the main build, CI, or release. Run it explicitly from this directory:
#
#   cargo run --release -- --server 127.0.0.1:25565 --bots 100
#
# Pinned to an azalea revision that targets Minecraft 26.2 (protocol 776), matching FerrumC.
[workspace]

[package]
name = "ferrumc-stress-bot"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The published releases stop at 0.16.0+mc26.1; 26.2 support only exists on the repository's main
# branch, so the dependency is pinned to an exact revision rather than a version. Bump it when
# FerrumC's protocol version moves, and check azalea's README for the version it targets.
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "153c90aa5570b3a94b909e82c1c0b60a90fff5db" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
